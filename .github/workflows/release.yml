name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      - name: 生成图标
        run: node scripts/make-icon.js

      - name: 打包单文件 exe
        run: npx @yao-pkg/pkg . --targets node22-win-x64 --output dist/ShareBox.exe

      - name: 写入 exe 图标与版本信息
        continue-on-error: true
        run: npx --yes rcedit@4 dist/ShareBox.exe --set-icon assets/app.ico --set-file-version "1.1.0" --set-product-version "1.1.0"

      - name: 生成安装包 (Inno Setup)
        # 免安装 exe 才是主要产物，安装包失败不阻塞发布
        continue-on-error: true
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Inno Setup 未预装，使用 choco 安装..."
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }
          if (-not $iscc) { Write-Host "::error::ISCC.exe 不可用"; exit 1 }
          Write-Host "ISCC: $iscc"
          & $iscc "installer\setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: ShareBox-Windows
          if-no-files-found: warn
          path: dist/*.exe

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe

  build-macos:
    name: macOS (arm64 + x64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      - name: 生成图标
        run: node scripts/make-icon.js

      # 分两次单 target 调用：多 target 时 pkg 只追加差异后缀（两个 mac 目标
      # 仅 arch 不同，会生成 ShareBox-arm64 / ShareBox-x64，不带 -macos），
      # 单 target 时输出路径完全可控
      - name: 打包二进制 (arm64)
        run: npx @yao-pkg/pkg . --targets node22-macos-arm64 --output dist/ShareBox-macos-arm64

      - name: 打包二进制 (x64)
        run: npx @yao-pkg/pkg . --targets node22-macos-x64 --output dist/ShareBox-macos-x64

      - name: 打包成 .app
        run: |
          node scripts/make-mac-app.js dist/ShareBox-macos-arm64 "dist/LAN ShareBox-arm64.app" assets/app.icns
          node scripts/make-mac-app.js dist/ShareBox-macos-x64 "dist/LAN ShareBox-x64.app" assets/app.icns

      - name: 临时签名（Apple Silicon 要求二进制必须签名才能运行）
        run: |
          codesign --force --deep --sign - "dist/LAN ShareBox-arm64.app" || true
          codesign --force --deep --sign - "dist/LAN ShareBox-x64.app" || true

      # zip 用 ditto 生成，保留权限与资源分支，作为必然产出的兜底格式
      - name: 生成 zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/LAN ShareBox-arm64.app" "dist/LAN-ShareBox-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/LAN ShareBox-x64.app" "dist/LAN-ShareBox-x64.zip"

      - name: 生成 dmg
        continue-on-error: true
        run: |
          hdiutil create -volname "LAN ShareBox" -srcfolder "dist/LAN ShareBox-arm64.app" -ov -format UDZO -fs HFS+ "dist/LAN-ShareBox-arm64.dmg"
          hdiutil create -volname "LAN ShareBox" -srcfolder "dist/LAN ShareBox-x64.app" -ov -format UDZO -fs HFS+ "dist/LAN-ShareBox-x64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ShareBox-macOS
          if-no-files-found: warn
          path: |
            dist/*.dmg
            dist/*.zip

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
